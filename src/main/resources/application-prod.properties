# ==========================================
# 1. C?U HÌNH DATABASE (POSTGRESQL)
# ==========================================
# ??c DB URL, Username và Password t? bi?n môi tr??ng c?a Server
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/job_portal}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# T?i ?u Connection Pool cho Production
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
# ==========================================
# 2. C?U HÌNH HIBERNATE / JPA (QUAN TR?NG)
# ==========================================
# ??i thành 'validate' (ch? ki?m tra xem DB kh?p v?i Entity ko) ho?c 'none'
# TUY?T ??I KHÔNG dùng 'update' ? Production ?? tránh l?i m?t/h?ng d? li?u th?t
spring.jpa.hibernate.ddl-auto=validate
# T?t show SQL ?? ti?t ki?m CPU cho server và tránh rác log
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ==========================================
# 3. B?O M?T JWT
# ==========================================
# L?y Secret Key t? bi?n môi tr??ng ?? không l? key trong source code
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=900000
jwt.refresh-token.expiration=10800000
# ==========================================
# 4. C?U HÌNH UPLOAD FILE & PHÂN TRANG
# ==========================================
spring.data.web.pageable.one-indexed-parameters=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# ???NG D?N UPLOAD FILE: Server Linux KHÔNG CÓ ? D:/
# Ta truy?n qua bi?n môi tr??ng. Ví d? m?c ??nh trên Linux là /opt/myapp/uploads/
# ==========================================
# 5. CONFIG EMAIL (GMAIL SMTP)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# ?n Email và App Password
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# ==========================================
# 6. CONFIG CLOUDINARY
# ==========================================
# ?n API Key c?a Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
# ==========================================
# 7. PYTHON AI API
# ==========================================
# Link t?i server Python (vì có th? server Python không ch?y chung port 8000 trên production)
python.ai.base-url=${PYTHON_AI_BASE_URL}
python.ai.extract-cv-path=/api/v1/ai/extract-cv
python.ai.match-path=/api/v1/ai/match
python.ai.generate-jd-path=/api/v1/ai/generate-jd